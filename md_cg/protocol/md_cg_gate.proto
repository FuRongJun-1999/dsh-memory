// md_cg 判定层 · 可协议化闸门 v0.1
// 来源：forgetting.py assess() 七步阶梯 · protect.py is_protected()/is_immutable()
// 语言契约（实测，见 out/probe*.proto）：
//   · 且/或/非 静默恒假 → 复合条件一律用嵌套 若（等效 AND）
//   · ≥ 闭区间用「若 X 小于 t，则 <不满足>，否则 <满足>」保真
//   · 裸赋值会被静默丢弃 → 赋值全包在 若 分支内，第 1 步顺带初始化 裁决
//   · 变量名禁用数字后缀
//   · 输入符号必须全部显式传入：未传=未声明（抛 NameError），而非默认为 0
//   · check 的 statements 计数在 3 层嵌套上坍缩为 1（forgetting 单段 8 条也报 1 条），
//     但编译指令数与运行终态均正确 —— 该计数不可用作正确性判据
// 输入（Python 侧数值化）：重要度 冗余 新信息 来源内定 层保护 显式保护 显式不可变 自我状态
// 输出：裁决 1=ACCEPT 2=MERGE 3=DROP 4=DEFER；保护 1/0；不可覆盖 1/0
// 阈值：0.70 0.85 0.60 0.30 0.15（forgetting.py / protect.py 常量）
// 语句 1-7 = 遗忘闸门（顺序即语义）；8-10 = 不可遗忘；11-14 = 不可覆盖（9=未命中哨兵）

问曰：此条记忆当写否，既有自我认知可改否？
答曰：依 forgetting 七步阶梯与 protect 三层保护裁决。
术曰：
1。若 重要度 小于 0.7，则 裁决 = 0，否则 裁决 = 1；
2。若 裁决 等于 0，则 若 来源内定 大于 0.5，则 若 冗余 小于 0.6，则 裁决 = 0，否则 裁决 = 3；
3。若 裁决 等于 0，则 若 冗余 小于 0.85，则 裁决 = 0，否则 裁决 = 2；
4。若 裁决 等于 0，则 若 重要度 小于 0.3，则 若 冗余 小于 0.6，则 裁决 = 0，否则 裁决 = 4；
5。若 裁决 等于 0，则 若 重要度 小于 0.3，则 裁决 = 0，否则 裁决 = 1；
6。若 裁决 等于 0，则 若 新信息 小于 0.15，则 裁决 = 0，否则 裁决 = 1；
7。若 裁决 等于 0，则 裁决 = 4；
8。若 层保护 大于 0.5，则 保护 = 1，否则 保护 = 9；
9。若 保护 等于 9，则 若 显式保护 大于 0.5，则 保护 = 1；
10。若 保护 等于 9，则 若 重要度 小于 0.7，则 保护 = 0，否则 保护 = 1；
11。若 自我状态 大于 0.5，则 不可覆盖 = 0，否则 不可覆盖 = 9；
12。若 不可覆盖 等于 9，则 若 层保护 大于 0.5，则 不可覆盖 = 1；
13。若 不可覆盖 等于 9，则 若 显式不可变 大于 0.5，则 不可覆盖 = 1；
14。若 不可覆盖 等于 9，则 不可覆盖 = 0；
15。止。
