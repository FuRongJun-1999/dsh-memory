name: 灵枢悬赏
description: 发布一条悬赏任务（发布方/维护者用；认领与规则见 docs/bounty/README.md）
title: "[悬赏] "
labels: ["bounty", "bounty:open"]
body:
  - type: markdown
    attributes:
      value: |
        ## 发布一条悬赏

        本模板发布的任务会进入**灵枢悬赏板**：外部人或 AI agent 在评论里 `/claim` 认领，
        交付后过**验收四闸**（① CI 全绿 ② 复现读数 ③ 守卫＋定点变异 ④ 维护者人审），
        结算记入可追溯的声誉账本（**不涉资金**）。

        - 认领/交付/释放/争议：`/claim`、`/deliver <PR 链接或证据块>`、`/withdraw`、`/dispute <理由>`
        - 认领期 **72 小时**；超时自动回板（记 −1）；同一认领人并发认领上限 **2**
        - 难度标签请另打 `difficulty:{easy|medium|hard|expert}`（决定结算分：1/3/6/10）

        **验收标准是本悬赏的命根子**——请写成**可机械复核**的判据（谁在什么条件下会红/会绿），
        不要写「质量好」「看得过去」这类不可判的表述。

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准（必填 · 可机械复核）
      description: >-
        写清「交付物 + 可复跑命令 + 期望读数」。例：`python -X utf8 scripts/x.py` 退出码 0，
        且贴出的原始读数与声明逐项一致；含守卫件时须带「注入必失败 ⇒ 断言必红」的定点变异自证。
      placeholder: |-
        1. 交付物：scripts/xxx.py（或 PR 链接）
        2. 复跑命令：python -X utf8 scripts/xxx.py
        3. 期望读数：退出码 0；输出末行「通过 N / 失败 0」
        4. 反面对照：把判据 A 短路 ⇒ 断言 B 必须转红并点名
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: 难度（决定结算分）
      description: 结算分口径见 docs/bounty/README.md（设计稿建议值，待裁定）
      options:
        - easy（1 分 · 单点、半小时内）
        - medium（3 分 · 需要读两三个文件、带读数）
        - hard（6 分 · 跨模块、需要设计判据）
        - expert（10 分 · 涉架构判断或硬骨头缺陷）
    validations:
      required: true

  - type: dropdown
    id: deliverable
    attributes:
      label: 期望交付形态
      description: 修码类走 PR（CI 会跑该 PR）；分析/复现类走评论证据块（可复跑读数）
      options:
        - PR（修码类）
        - 评论证据块（分析 / 复现类）
        - 两者皆可
    validations:
      required: true

  - type: textarea
    id: refs
    attributes:
      label: 参考材料
      description: >-
        相关文档 / issue / PR / 既有读数（仓内写相对路径，外部写链接）。
        给出「先读哪几件」能让认领者少走弯路，也便于我们事后复核判定。
      placeholder: |-
        - 设计稿：docs/plans/xxx_v0.1.md
        - 相关守卫：scripts/test_xxx.py
        - 既有读数：PR #123 的复现评论
    validations:
      required: false

  - type: textarea
    id: boundary
    attributes:
      label: 边界与不做项（可选）
      description: 明确「不做什么」——防交付范围漂移（我们只按上面那份验收标准判定）
      placeholder: |-
        - 不动 xxx 模块
        - 不改既有判据的阈值
    validations:
      required: false

  - type: checkboxes
    id: ack
    attributes:
      label: 发布前自检
      options:
        - label: 验收标准可机械复核（复跑命令 + 期望读数齐备）
          required: true
        - label: 已在标签区加上 `difficulty:{easy|medium|hard|expert}`
          required: false
