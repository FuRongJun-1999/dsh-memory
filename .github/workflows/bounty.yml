name: bounty

# 灵枢悬赏板 · 事件路由（**薄壳**：只做事件分发与调用，业务逻辑全在
# `scripts/bounty_board.py`——可本地跑、可离线演练、可测）。
#
# 为什么需要这一件：把公开仓的 issue 池变成**可认领的悬赏任务**（外部人或 AI agent
# 认领 → 交付 → 过我们现成的确定性验收闸 → 记入可追溯的声誉账本）。规则对外见
# `docs/bounty/README.md`；设计稿 `docs/plans/悬赏板设计_v0.1.md`。
#
# 两条腿：
#   · `issue_comment`：评论里的 `/claim` `/deliver` `/withdraw` `/dispute`
#     （维护者另可 `/verify` `/settle`）——命令**只认行首最前的词**，正文中间的
#     `/claim` 不是命令（判据在脚本的 `parse_command`，不在本文件）。
#   · `schedule`（每 6 小时）＋ `workflow_dispatch`（手工触发）：扫描
#     `bounty:claimed` 且超期的 issue → 回板 `bounty:open` 并留评论说明。
#
# 安全模型（本 workflow 的成立前提，改动前先读）：
#   · **事件载荷（评论正文——攻击者可控文本）从不进 shell 正文**：本文件只把
#     GitHub 提供的 `$GITHUB_EVENT_PATH`（payload JSON 文件）交给 python 脚本读取
#     （同 repro-bot.yml 的注入面纪律：`${{ … }}` 一律不进 `run:` 正文）。
#   · **令牌只经环境变量进脚本**（`BOUNTY_GH_TOKEN`）——不进命令行参数、不落盘、
#     不打印；脚本侧只从 env 读（`scripts/bounty_board.py::token_from_env`）。
#   · checkout 用 `persist-credentials: false`——不把令牌落进检出仓的 .git/config。
#   · **绝不用自托管 runner**（同 repro-bot / gate 口径）。
#   · 写动作需 `--apply` 显式开启：不给它时脚本只打印计划（本地核验用）。
#
# 权限（**最小面**，逐项写清用途）：
#   issues: write        回评 ＋ 加/删状态标签（＋首跑幂等建标签体系）
#   pull-requests: read  交付链接指向本仓 PR 时读其元数据（号/标题/态/head sha）
#   contents: read       checkout 取业务脚本——**无它 job 起不来**，是「最小」在此
#                        处的真实下界（本 workflow 不写仓、不做任何提交）
permissions:
  contents: read
  issues: write
  pull-requests: read

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# 同一 issue 上串行（防两条命令并发改标签）；不同 issue 互不阻塞。
# cancel-in-progress: false —— 认领/交付是**状态迁移**，中途打断会留下半截痕。
concurrency:
  group: bounty-${{ github.event.issue.number || github.event_name }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  route:
    # PR 评论不在悬赏板面内（`issue_comment` 对 PR 也触发）——脚本内还有一层同判据，
    # 这里先拦一道，省一次 checkout 与 API 调用。
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 状态机与路由唯一入口（零第三方依赖：纯 stdlib）。
      # `--apply` 才真写；事件名由 GITHUB_EVENT_NAME 给定（schedule/workflow_dispatch
      # 走超时回收那条腿）。脚本退出码：0 正常 / 1 用法 / 2 环境错误（fail-closed）。
      - name: 路由（issue_comment 命令 ／ schedule 超时回板）
        env:
          BOUNTY_GH_TOKEN: ${{ github.token }}
        run: |
          python -X utf8 scripts/bounty_board.py \
            --event-file "$GITHUB_EVENT_PATH" \
            --apply \
            --ledger-out "$RUNNER_TEMP/bounty_events.jsonl"

      # 账本收口：本 workflow **不持** contents: write（权限最小化），故不自己提交
      # `docs/bounty/ledger.json`——本批事件以 JSONL 落 artifact，由维护者本地并入：
      #   python -X utf8 scripts/bounty_board.py --ledger-append <events.jsonl>
      #   python -X utf8 scripts/bounty_board.py --board-out docs/bounty/board.md
      - name: 本批账本事件（artifact；供维护者并入账本）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty-ledger-events
          path: ${{ runner.temp }}/bounty_events.jsonl
          if-no-files-found: ignore
          retention-days: 90
