name: cogmap-check

on:
  push:
    paths:
      - README.md
      - docs/功能调用映射表_v0.1.md
      - scripts/cogmap_sync.py
      - md_cg/mcp_server.py
      - md_cg/whitebox.py
      - .github/workflows/cogmap-check.yml
  pull_request:
    paths:
      - README.md
      - docs/功能调用映射表_v0.1.md
      - scripts/cogmap_sync.py
      - md_cg/mcp_server.py
      - md_cg/whitebox.py
      - .github/workflows/cogmap-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 认知图文档与源码真源一致性（README COGMAP + 映射表 FUNCMAP：工具/op/链接/锚点/FUNC_DESC/分支数自检）
        run: python scripts/cogmap_sync.py check
