name: python-tests

# Python 侧全量套件接入 CI（2026-09-20 v15-2 修复）。
#
# 为什么必须有：此前 6 个 workflow **无一**调用 `scripts/run_tests.py`，147 目标的
# Python 套件完全在 CI 之外——于是 `md_cg/test_datapath_root`（一条只在 Windows 成立的
# 断言）从入库那刻起就在 POSIX 上红着，而**没有任何流水线会拦下它**：
# 「干净克隆上全绿」这一对外承诺因此长期不成立且无人可见。红基线看得见，才有自愈闭环。
#
# 刻意**不加 paths 过滤**：套件覆盖面横跨 md_cg/、hive/、compiler/、swarm/、scripts/，
# 任何一处改动都可能让它变红；paths 白名单一旦漏项就会重现「改动不入门禁」的盲区
# （20260915 cogmap-check 已有前例）。全量跑换「红基线必然可见」。
#
# CI 与部署侧的差异是**设计内**的：无真源数据面的目标由 `run_tests.py` 按依赖检查
# SKIP（如实标记跳过理由，不是假绿）。
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 套件里 scripts/test_injection_chain.py 经 verify_discipline → render_discipline
      # 依赖 pyyaml（discipline-check job 已装，python-tests job 此前漏装 → 该用例
      # 在这里恒红 `ModuleNotFoundError: No module named 'yaml'`，属依赖面不一致，
      # 不是被测缺陷）。两个 job 的依赖面保持同款。
      - name: 依赖（scripts/test_injection_chain 需要 pyyaml）
        run: python -m pip install pyyaml
      # 全量套件包含需要 release 二进制的 Rust / Hive 守卫；裸 runner 没有
      # 工作区缓存，必须在测试前显式构建，否则会把“未构建”误报成代码失败。
      - name: 构建 Rust release 二进制
        run: |
          cargo build --release --manifest-path rust/Cargo.toml
          cargo build --release --manifest-path hive/Cargo.toml
      - name: Python 全量套件（scripts/run_tests.py）
        # 多个 hive 守卫共享临时工作区与生成表；并行执行会产生竞态假红。
        run: python scripts/run_tests.py --jobs 1
