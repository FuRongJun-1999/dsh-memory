name: publish-artifact-check

# 发版门禁（产物面内容政策）：本地 `npm publish`（prepublishOnly）与 CI 共用同一判据脚本
# scripts/check_publish_artifact.py。四类硬失败：R1 凭据/密钥 · R2 私有数据面（白箱 KB 运行时
# 数据 / 实验区 / 孤节点 / 缓存）· R3 隐私文本（本机与沙箱路径）· R4 非追踪件（包内出现
# gitignore 面即拦）。退出码 0 通过 / 1 有命中 / 2 环境错误——fail-closed，绝不静默放行。
#
# N216（2026-09-28，high）：本 workflow 的 paths 含 package.json（:14/:30），改 package.json
# 的 PR 即触发本门禁——而门禁的「发布清单」取自 `npm pack --dry-run --json` 的 stdout，npm
# 先跑生命周期脚本（prepare/prepack/postpack）且其 stdout 排在 npm 自身清单**之前**。故清单
# 来源必须自证：R5 清单条目不得越出 --root（`..`/绝对/盘符/UNC）；R6 只认 npm 自身产出的
# **全形态**清单（files 逐条含 path/size/mode，取末段），并以 `--ignore-scripts` 基线交叉核验
# 「基线 ⊆ 所选清单」（脚本只能增件，诱饵为骗过 R1/R4 必然漏列真发布件）。R5/R6 任一命中即
# VERDICT=FAIL——生命周期脚本打印的清单不能冒充发布清单。
#
# N251（2026-10-05，high）：清单可信不等于清单**扫完**——内容面只覆盖「读得进来」的条目，
# 而 `read_local_text_if_needed` 的三处静默 `return None`（stat 失败 / 超 TEXT_SIZE_LIMIT /
# open 失败）与 `--registry` 侧的成员过滤都把「未扫」压成「已扫且干净」：被跳过的子集零
# NOTE、零计数，R1 照打「内容面=0」、VERDICT=PASS / exit 0。实测：真形态令牌放进
# 4,194,443 B 的 lib/big.txt（在清单内、size 字段在场）静默出货，同内容放进 53 B 小文件
# 即 R1 FAIL（判据随文件大小翻转）；postpack 删掉 lib/gone.txt 后清单仍列该件而盘上已无，
# 同样静默。故新增 R7 扫描面完整性：清单内文本件读不到 / 超限 / 真实路径越根一律逐条记账
# 并判负——「未扫」不再等价于「干净」。
#
# 背景（2026-09-20 取证）：0.4.9 / 0.4.10 发布件实测夹带非追踪件（docs/experiments 2434 件、
# whitebox_kb 运行时数据、md_cg/knowledge/orphan）；本 workflow 把「发版前机械核验」从人工
# 记忆变为门禁。已发布版本按使用者裁定不回溯处置，红着即拦下一次发布。
on:
  push:
    paths:
      - 'package.json'
      - '.npmignore'
      - '.gitignore'
      - 'README.md'
      - 'scripts/check_publish_artifact.py'
      - 'scripts/check_local_paths.py'
      - '.github/workflows/publish-artifact-check.yml'
      - 'lib/**'
      - 'src/**'
      - 'md_cg/**'
      - 'skills/**'
      - 'dsh/**'
      - 'hive/**'
      - 'codebuddy/**'
      - 'zcode/**'
      - 'docs/**'
  pull_request:
    paths:
      - 'package.json'
      - '.npmignore'
      - '.gitignore'
      - 'README.md'
      - 'scripts/check_publish_artifact.py'
      - 'scripts/check_local_paths.py'
      - '.github/workflows/publish-artifact-check.yml'
      - 'lib/**'
      - 'src/**'
      - 'md_cg/**'
      - 'skills/**'
      - 'dsh/**'
      - 'hive/**'
      - 'codebuddy/**'
      - 'zcode/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # npm 由 runner 自带（node 预装）——`npm pack --dry-run` 不需要安装依赖
      - name: 门禁脚本自检（内置断言：四类规则的正负例 + 不命中自身源码）
        run: python scripts/check_publish_artifact.py --selftest
      - name: 产物面政策检查（npm pack --dry-run 清单 × git ls-files 追踪集合）
        run: python scripts/check_publish_artifact.py
      # B6（2026-10-05）：npm 面由上面的 R3 规则把守；GitHub 公开面（git 追踪件全量）
      # 另有本机路径门禁——本机目录结构不得进入仓库（相对路径/中性占位）。
      - name: 本机路径门禁自检（正负样例 + 不命中自身源码）
        run: python scripts/check_local_paths.py --selftest
      - name: 追踪面本机路径扫描（git ls-files 全量）
        run: python scripts/check_local_paths.py
