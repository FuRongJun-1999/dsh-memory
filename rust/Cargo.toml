[package]
name = "mdcg-eval"
version = "0.2.0"
edition = "2021"
description = "灵枢记忆系统 · Rust 检索库（大批量四路 RRF + serve 进程实例）与公开数据集评测器"

# 零第三方依赖：与 md_cg 的 D-005 约束一致，且无需联网取 crate。
[dependencies]

[lib]
name = "mdcg_eval"
path = "src/lib.rs"

[[bin]]
name = "mdcg-eval"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
